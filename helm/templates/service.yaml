apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-gateway
  labels:
    app: {{ .Chart.Name }}
    component: gateway
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.gateway.port }}
      protocol: TCP
  selector:
    app: {{ .Chart.Name }}
    component: gateway
