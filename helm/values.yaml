replicaCount: 2

image:
  repository: ghcr.io/madhumitha-murthy/multi-agent-researcher
  tag: latest
  pullPolicy: IfNotPresent

gateway:
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

env:
  LOG_LEVEL: INFO
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

secrets:
  jwtSecretKey: ""
  geminiApiKey: ""

ingress:
  enabled: true
  host: research.example.com
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
