apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-agent-researcher
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/madhumitha-murthy/multi-agent-researcher.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: research-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
